<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Winter Arc — Rank up</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#05080C}
a{color:#6CC7FF}a:hover{color:#A9DEFF}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #05080C; color: #E8EEF5; font-family: 'Archivo', 'Helvetica Neue', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 72px 24px 40px; overflow: hidden">

<div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 3px; color: #93A1B2">DAY 34 · RANK UP</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 22px">
<div style="position: relative; width: 220px; height: 240px; display: flex; align-items: center; justify-content: center">
<svg width="220" height="240" viewBox="0 0 220 240" fill="none">
<polygon points="110,8 206,62 206,178 110,232 14,178 14,62" stroke="#1E3A4E" stroke-width="2"></polygon>
<polygon points="110,30 186,74 186,166 110,210 34,166 34,74" stroke="{{accent}}" stroke-width="3"></polygon>
<polygon points="110,58 160,88 160,152 110,182 60,152 60,88" fill="#10202B" stroke="{{accent}}" stroke-width="1.5" stroke-opacity="0.5"></polygon>
<path d="M88 132l22-36 22 36M96 120h28" stroke="{{accent}}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M110 0v18M110 222v18M0 120h10M210 120h10" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6"></path>
</svg>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 4px; color: {{accent}}">NEW RANK</span>
<span style="font-size: 48px; font-weight: 800; letter-spacing: 2px; line-height: 1">CONTENDER</span>
<span style="font-size: 15px; color: #B8C7D6; text-align: center; line-height: 1.5">2,500 arc points in 34 days.<br>Next: Warrior at 4,500.</span>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%">
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 0; border-radius: 14px; border: 1px solid #1F2A36"><span style="font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 600">81%</span><span style="font-size: 11px; color: #93A1B2">consistency</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 0; border-radius: 14px; border: 1px solid #5C3418"><span style="font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 600; color: #FFB27D">14</span><span style="font-size: 11px; color: #C9A58C">day streak</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 0; border-radius: 14px; border: 1px solid #1F2A36"><span style="font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 600">3</span><span style="font-size: 11px; color: #93A1B2">badges</span></div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px; width: 100%">
<button style="height: 52px; border-radius: 14px; border: none; background: {{accent}}; color: #05080C; font-size: 16px; font-weight: 700; cursor: pointer">Continue</button>
<button style="height: 52px; border-radius: 14px; border: 1px solid #2C3A4A; background: transparent; color: #E8EEF5; font-size: 16px; font-weight: 600; cursor: pointer">Share</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6CC7FF","options":["#6CC7FF","#8FE3CF","#B9A6FF","#E8EEF5"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#6CC7FF' };
  }
}
</script>
</body>
</html>
