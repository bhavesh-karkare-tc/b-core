<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Winter Arc — Today</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0F14}
a{color:#6CC7FF}a:hover{color:#A9DEFF}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0F14; color: #E8EEF5; font-family: 'Archivo', 'Helvetica Neue', sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="display: flex; flex-direction: column; gap: 18px; padding: 52px 20px 12px; flex-grow: 1; overflow: hidden">

<div style="display: flex; justify-content: space-between; align-items: flex-start">
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 2px; color: {{accent}}">WINTER ARC · FRI 23 OCT</div>
<div style="display: flex; align-items: baseline; gap: 8px"><span style="font-size: 40px; font-weight: 800; letter-spacing: -1px; line-height: 1">Day 23</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 16px; color: #93A1B2">/ 92</span></div>
</div>
<div style="display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px; background: #2A1A10; border: 1px solid #5C3418">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FF8A3D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 3 4 5 4 9a4 4 0 0 1-8 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 0-8z"></path></svg>
<span style="font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 14px; color: #FFB27D">9</span>
<span style="font-size: 12px; color: #FFB27D">streak · safe</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: grid; grid-template-columns: 31fr 30fr 31fr; gap: 4px">
<div style="height: 6px; border-radius: 3px; background: #1F2A36; overflow: hidden"><div style="width: 74%; height: 6px; background: {{accent}}"></div></div>
<div style="height: 6px; border-radius: 3px; background: #1F2A36"></div>
<div style="height: 6px; border-radius: 3px; background: #1F2A36"></div>
</div>
<div style="display: grid; grid-template-columns: 31fr 30fr 31fr; gap: 4px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #93A1B2; letter-spacing: 1px">
<span style="color: #E8EEF5">OCT · 23/31</span><span>NOV</span><span>DEC</span>
</div>
</div>

<div style="display: flex; align-items: center; gap: 18px; padding: 16px; border-radius: 20px; background: #121821; border: 1px solid #1F2A36">
<div style="position: relative; width: 116px; height: 116px; flex-shrink: 0">
<svg width="116" height="116" viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="#1F2A36" stroke-width="10"></circle><circle cx="60" cy="60" r="52" fill="none" stroke="{{accent}}" stroke-width="10" stroke-linecap="round" stroke-dasharray="163.4 326.7" transform="rotate(-90 60 60)"></circle></svg>
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 32px; font-weight: 600; line-height: 1">50</span>
<span style="font-size: 12px; color: #93A1B2">of 100 so far</span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; flex-grow: 1">
<div style="font-size: 16px; font-weight: 700">5 of 10 done</div>
<div style="font-size: 13px; color: #93A1B2">Strong day at 80. Five more ticks to stay safe.</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 4px 8px; border-radius: 6px; background: #17212C; color: #C7D2DE">SHIELD ×1</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 4px 8px; border-radius: 6px; background: #17212C; color: #C7D2DE">FIGHTER</span>
</div>
</div>
</div>

<div style="display: flex; justify-content: space-between; align-items: baseline">
<h2 style="margin: 0; font-size: 18px; font-weight: 700">Today's habits</h2>
<a href="#" style="font-size: 13px; text-decoration: none">Edit</a>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{habits}}" as="h" hint-placeholder-count="10">
<div style="display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 14px; border-radius: 14px; background: #121821; border: 1px solid #1F2A36">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #6B7A8C; width: 18px">{{h.num}}</span>
<div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1; min-width: 0">
<span style="font-size: 15px; font-weight: 600">{{h.name}}</span>
<span style="font-size: 12px; color: #93A1B2">{{h.meta}}</span>
<sc-if value="{{h.hasBar}}" hint-placeholder-val="{{false}}">
<div style="height: 4px; border-radius: 2px; background: #1F2A36; overflow: hidden"><div style="height: 4px; width: {{h.pct}}; background: {{accent}}"></div></div>
</sc-if>
</div>
<sc-if value="{{h.done}}" hint-placeholder-val="{{false}}">
<button aria-label="Mark not done" style="width: 48px; height: 44px; border-radius: 12px; border: none; background: {{accent}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B0F14" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L19 7"></path></svg></button>
</sc-if>
<sc-if value="{{h.pending}}" hint-placeholder-val="{{true}}">
<button aria-label="Log habit" style="width: 48px; height: 44px; border-radius: 12px; border: 1.5px solid #2C3A4A; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#93A1B2" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
</sc-if>
</div>
</sc-for>
</div>
</div>

<div style="padding: 10px 20px; border-top: 1px solid #1F2A36; background: #0B0F14">
<button style="width: 100%; height: 52px; border-radius: 14px; border: none; background: #E8EEF5; color: #0B0F14; font-size: 16px; font-weight: 700; cursor: pointer">Close the day</button>
</div>

<nav style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 8px 8px 24px; background: #0B0F14; border-top: 1px solid #1F2A36">
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; text-decoration: none; color: {{accent}}; font-size: 11px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"></path></svg>Today</a>
<a href="Tracker.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; text-decoration: none; color: #6B7A8C; font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>Tracker</a>
<a href="Dashboard.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; text-decoration: none; color: #6B7A8C; font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>Dashboard</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; text-decoration: none; color: #6B7A8C; font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"></path><path d="M9 12h7M9 16h5"></path></svg>Reports</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6CC7FF","options":["#6CC7FF","#8FE3CF","#B9A6FF","#E8EEF5"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var rows = [
      ['3L Water', '2,250 / 3,000 ml', false, '75%'],
      ['No Junk', 'Clean all day', true, null],
      ['Phone Off by 12 AM', 'Target 12:00 AM', false, null],
      ['MMA Training', 'Session · 60 min', true, null],
      ['10k Steps Outside', '6,200 / 10,000', false, '62%'],
      ['Read 10 Pages', '4 / 10 pages', false, '40%'],
      ['No Phone at Meals', '3 of 3 meals', true, null],
      ['Top 3 Tasks Done', '1 / 3 tasks', false, '33%'],
      ['Skin Care', 'Morning + night', true, null],
      ['No P', 'Yes / no', true, null]
    ];
    var habits = rows.map(function (r, i) {
      return { num: (i + 1 < 10 ? '0' : '') + (i + 1), name: r[0], meta: r[1], done: r[2], pending: !r[2], hasBar: !!r[3] && !r[2], pct: r[3] || '0%' };
    });
    return { accent: this.props.accent ?? '#6CC7FF', habits: habits };
  }
}
</script>
</body>
</html>
